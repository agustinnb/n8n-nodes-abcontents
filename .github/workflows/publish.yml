# Publishes to npm with provenance when a v* tag is pushed. Uses npm Trusted Publishing (OIDC): no token is stored.
name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          RELEASE_MODE: '1' # the n8n template's prepublishOnly blocks a plain npm publish without it
